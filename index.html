    <meta charset="UTF-8" />

    <title>¡Exaltado! EBV 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Nunito', sans-serif; /* Changed from Fredoka to Nunito for cleaner "top" look */
      }
      h1, h2, h3, h4, h5, h6, .font-display {
        font-family: 'Luckiest Guy', cursive;
        letter-spacing: 0.05em;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Button Vibration Animation */
      @keyframes vibrate {
        0% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
        100% { transform: translate(0); }
      }
      .hover-vibrate:hover {
        animation: vibrate 0.3s linear infinite;
      }
      
      /* Cool Text Stroke for Titles */
      .text-stroke {
        -webkit-text-stroke: 2px black;
        paint-order: stroke fill;
      }
      @media (min-width: 768px) {
        .text-stroke-lg {
          -webkit-text-stroke: 4px black;
        }
      }
    </style>
