version: 2.1

orbs:
  node: circleci/node@5.0.3

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main

jobs:
  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build project
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - .firebaserc
            - firebase.json

  deploy:
    executor: node/default
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Deploy to Firebase
          command: npm install -g firebase-tools && firebase deploy --token=$FIREBASE_TOKEN
